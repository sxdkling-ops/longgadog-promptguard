<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>PromptGuard PH</title>
<style>
  :root { --brand-50: oklch(98.4% 0.014 180.72); --brand-100: oklch(95.3% 0.051 180.801); --brand-700: oklch(51.1% 0.096 186.391); --brand-800: oklch(43.7% 0.078 188.216);
    --bg: #f8fafc; --surface: #fff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --edge: #94a3b8;
    --ok-bg: #dcfce7; --ok-fg: #166534; --bad-bg: #fee2e2; --bad-fg: #991b1b; --warn-bg: #fef3c7; --warn-fg: #92400e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9; --muted: #cbd5e1; --border: #334155; --edge: #64748b;
      --ok-bg: #052e16; --ok-fg: #bbf7d0; --bad-bg: #450a0a; --bad-fg: #fecaca; --warn-bg: #451a03; --warn-fg: #fde68a; --brand-100: oklch(27.7% 0.046 192.524); --brand-800: oklch(91% 0.096 180.426); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; display: grid; gap: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 36px; }
  .row + .row { border-top: 1px solid var(--border); }
  .badge { border-radius: 999px; padding: 2px 10px; font-size: 14px; font-weight: 500; white-space: nowrap; background: var(--border); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.brand { background: var(--brand-100); color: var(--brand-800); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; font-size: 14px; }
  li + li { border-top: 1px solid var(--border); }
  li strong { font-weight: 600; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--edge); background: var(--surface); color: var(--text); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--brand-700); outline-offset: 2px; }
</style>
</head>
<body>
  <div>
    <h1>PromptGuard PH</h1>
    <p class="muted">LonggaDog polices what you paste into every app on this PC. Only trusted work apps receive the original. There is nothing to switch on or off.</p>
  </div>

  <section class="card" aria-labelledby="h-status">
    <h2 id="h-status">Protection</h2>
    <div class="row"><span>Local gateway</span><span class="badge" id="gateway">Checking…</span></div>
    <div class="row"><span>Local AI</span><span class="badge" id="llm">Checking…</span></div>
    <div class="row"><span>App in front</span><span class="badge" id="focus">–</span></div>
  </section>

  <button type="button" id="dashboard">Open audit dashboard</button>

<script>
  const $ = (id) => document.getElementById(id);
  function badge(el, text, tone) { el.textContent = text; el.className = 'badge ' + tone; }
  function render(s) {
    badge($('gateway'), s.gateway ? 'Running' : 'Not running: pasting blocked', s.gateway ? 'ok' : 'bad');
    badge($('llm'), s.llm ? s.model : (s.gateway ? 'Off: pasting blocked' : 'Unknown'), s.llm ? 'ok' : 'bad');
    $('llm').title = s.llmReason || '';
    badge($('focus'), s.focus ? s.focus + (s.guarding ? ' (guarded)' : ' (trusted)') : '–', s.guarding ? 'brand' : 'ok');
  }
  window.pg.getState().then(render);
  window.pg.onState(render);
  $('dashboard').addEventListener('click', () => window.pg.openDashboard());
</script>
</body>
</html>
