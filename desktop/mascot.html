<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>LonggaDog</title>
<style>
  :root { --surface: #fff; --text: #0f172a; --muted: #475569; --line: #e2e8f0; --edge: #94a3b8; --brand: oklch(51.1% 0.096 186.391);
    --ok-bg: #dcfce7; --ok-fg: #166534; --bad-bg: #fee2e2; --bad-fg: #991b1b; --tint-bg: oklch(95.3% 0.051 180.801); --tint-fg: oklch(43.7% 0.078 188.216); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; color: var(--text); }
  * { box-sizing: border-box; }
  #stage { position: absolute; left: 70px; bottom: 8px; width: 200px; height: 200px; }
  /* The mascot is an original character drawn here as vector shapes, so it is transparent by nature and can
     change expression. Colours: tan coat, cream face, dark outline, teal PromptGuard collar. */
  #dog { position: absolute; inset: 0; width: 200px; height: 200px; overflow: visible; cursor: grab; filter: drop-shadow(0 4px 6px rgb(0 0 0 / .35));
    --px: 0; --py: 0; }
  #dog.dragging { cursor: grabbing; }
  #dog .ink { stroke: #3b1d0b; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  #head { transform: translate(calc(var(--px) * 4px), calc(var(--py) * 3px)); transition: transform .12s ease-out; }
  .pupil { transform: translate(calc(var(--px) * 4.5px), calc(var(--py) * 4px)); transition: transform .08s ease-out; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  #tail { transform-origin: 140px 152px; animation: wag 1.3s ease-in-out infinite; }
  #torso { transform-origin: 100px 196px; animation: breathe 3.2s ease-in-out infinite; }
  #brows, #barkmouth, #tongue, #angry { opacity: 0; transition: opacity .12s; }
  #barkmouth { transform-box: fill-box; transform-origin: 50% 0; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes wag { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(13deg); } }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.025); } }
  @keyframes yap { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1.15); } }

  /* Happy: tongue out, fast tail. Angry: lowered brows, barking mouth, anger mark, stiff tail. */
  #stage.happy #tongue { opacity: 1; }
  #stage.happy #tail { animation-duration: .22s; }
  #stage.angry #brows, #stage.angry #barkmouth, #stage.angry #angry { opacity: 1; }
  #stage.angry #smile { opacity: 0; }
  #stage.angry .eye { animation: none; transform: scaleY(.78); }
  #stage.angry #barkmouth { animation: yap .3s ease-in-out 6; }
  #stage.angry #tail { animation: none; transform: rotate(-14deg); }
  @media (prefers-reduced-motion: reduce) { .eye, #tail, #torso, #stage.angry #barkmouth { animation: none; } }

  /* Speech bubbles in a hand-drawn comic style: thick black outline, slightly uneven corners, a curved tail and a
     few loose strokes around the edge. */
  .bubble { position: absolute; left: 22px; right: 22px; bottom: 226px; padding: 14px 18px; background: #fff; color: #111;
    border: 3.5px solid #111; border-radius: 22px 28px 24px 20px / 26px 20px 28px 22px;
    opacity: 0; transform: translateY(8px) scale(.96) rotate(-1deg); transform-origin: 40% 100%; transition: opacity .18s, transform .18s; pointer-events: none;
    filter: drop-shadow(0 5px 8px rgb(0 0 0 / .3)); }
  .bubble.show { opacity: 1; transform: none; }
  .bubble .tail { position: absolute; left: 96px; bottom: -31px; }
  .bubble .tick { position: absolute; }
  .bubble .t1 { right: 26px; top: -17px; }
  .bubble .t2 { left: -17px; top: 14px; }
  .bubble .t3 { right: -19px; bottom: 4px; }
  .bubble strong { display: block; font-weight: 700; font-size: 15px; }
  .bubble .muted { color: #334155; font-size: 13px; overflow-wrap: anywhere; white-space: pre-line; }
  [hidden] { display: none !important; }
  .bubble.bad > strong { color: #b91c1c; font-size: 17px; letter-spacing: .02em; }
  .bubble.good > strong { color: #166534; }

  #stage.angry { animation: bark .32s ease-in-out 5; }
  #stage.happy { animation: hop .5s ease-in-out 2; }
  @keyframes bark { 0%, 100% { transform: none; } 25% { transform: translate(-5px, -7px) rotate(-3deg); } 60% { transform: translate(5px, -3px) rotate(3deg); } }
  @keyframes hop { 0%, 100% { transform: none; } 45% { transform: translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { #stage.angry, #stage.happy { animation: none; } }
  #info.show { pointer-events: auto; }
  #info h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 30px; }
  .row + .row { border-top: 1.5px dashed #94a3b8; }
  .badge { border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; background: var(--line); max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.bad { background: var(--bad-bg); color: var(--bad-fg); }
  .badge.tint { background: var(--tint-bg); color: var(--tint-fg); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; font: inherit; font-weight: 600; min-height: 44px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--edge); background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover { background: #f1f5f9; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover { filter: brightness(1.08); background: var(--brand); }

  #dot { position: absolute; left: 50%; bottom: 0; translate: -50% 0; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    background: var(--ok-bg); color: var(--ok-fg); border: 1px solid var(--ok-fg); box-shadow: 0 2px 6px rgb(0 0 0 / .3); pointer-events: none; }
  #dot.bad { background: var(--bad-bg); color: var(--bad-fg); border-color: var(--bad-fg); }
  @media (prefers-reduced-motion: reduce) { .bubble { transition: none; } }
</style>
</head>
<body>
  <div class="bubble" id="bubble" role="status" aria-live="polite"><svg class="tail" width="52" height="34" viewBox="0 0 52 34" aria-hidden="true"><path d="M8 0 H40" stroke="#fff" stroke-width="7"/><path d="M6 1 C8 14 16 25 36 31 C28 21 30 10 40 1" fill="#fff" stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="tick t1" width="96" height="14" viewBox="0 0 96 14" aria-hidden="true"><path d="M3 9 C30 4 60 3 93 6 M22 3 C44 1 64 1 84 2" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg><svg class="tick t2" width="14" height="50" viewBox="0 0 14 50" aria-hidden="true"><path d="M9 3 C4 16 4 32 8 47 M3 12 C1 20 1 28 3 36" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg><svg class="tick t3" width="18" height="30" viewBox="0 0 18 30" aria-hidden="true"><path d="M5 27 C11 20 14 12 14 3 M12 28 C15 24 16 20 16 16" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg><strong id="b-title"></strong><span class="muted" id="b-text"></span></div>

  <div class="bubble" id="info" role="dialog" aria-labelledby="i-title">
    <svg class="tail" width="52" height="34" viewBox="0 0 52 34" aria-hidden="true"><path d="M8 0 H40" stroke="#fff" stroke-width="7"/><path d="M6 1 C8 14 16 25 36 31 C28 21 30 10 40 1" fill="#fff" stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="tick t1" width="96" height="14" viewBox="0 0 96 14" aria-hidden="true"><path d="M3 9 C30 4 60 3 93 6 M22 3 C44 1 64 1 84 2" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg><svg class="tick t2" width="14" height="50" viewBox="0 0 14 50" aria-hidden="true"><path d="M9 3 C4 16 4 32 8 47 M3 12 C1 20 1 28 3 36" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg><svg class="tick t3" width="18" height="30" viewBox="0 0 18 30" aria-hidden="true"><path d="M5 27 C11 20 14 12 14 3 M12 28 C15 24 16 20 16 16" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/></svg>
    <strong id="i-title">LonggaDog is on guard</strong>
    <span class="muted" id="i-sub">Only trusted work apps get the original. Everything else gets the safe copy.</span>
    <h2>Protection</h2>
    <div class="row"><span>Local gateway</span><span class="badge" id="i-gateway">–</span></div>
    <div class="row"><span>Local AI</span><span class="badge" id="i-llm">–</span></div>
    <div class="row"><span>App in front</span><span class="badge" id="i-focus">–</span></div>
    <div class="row"><span>Browser sensor</span><span class="badge" id="i-sensor-state">–</span></div>
    <div class="actions" id="i-sensor-row" hidden><button type="button" class="primary" id="i-sensor">Set up browser sensor</button></div>
    <div class="actions">
      <button type="button" id="i-close">Close</button>
      <button type="button" id="i-dash">Audit dashboard</button>
    </div>
  </div>

  <div id="stage">
    <svg id="dog" viewBox="0 0 200 200" role="img" aria-label="LonggaDog, the PromptGuard mascot. Drag to move. Right-click for status.">
      <g id="tail"><path class="ink" d="M136 156 q40 -2 36 -42 q-2 -12 -12 -8 q6 26 -26 34 z" fill="#b45309"/></g>
      <g id="torso">
        <path class="ink" d="M58 197 q-12 -58 42 -62 q54 4 42 62 z" fill="#c2651a"/>
        <path d="M100 150 q-20 6 -18 46 h36 q2 -40 -18 -46 z" fill="#fde7c3"/>
        <ellipse class="ink" cx="80" cy="192" rx="15" ry="8" fill="#fde7c3"/>
        <ellipse class="ink" cx="120" cy="192" rx="15" ry="8" fill="#fde7c3"/>
      </g>
      <g id="head">
        <path class="ink" d="M64 50 q-34 -6 -36 34 q0 26 16 26 q12 0 14 -22 q2 -22 16 -30 z" fill="#8a3f0c"/>
        <path class="ink" d="M136 50 q34 -6 36 34 q0 26 -16 26 q-12 0 -14 -22 q-2 -22 -16 -30 z" fill="#8a3f0c"/>
        <ellipse class="ink" cx="100" cy="88" rx="52" ry="46" fill="#c2651a"/>
        <path d="M100 60 q-34 18 -30 50 q30 26 60 0 q4 -32 -30 -50 z" fill="#fde7c3"/>
        <g class="eye"><ellipse class="ink" cx="79" cy="84" rx="11" ry="13" fill="#fff"/><g class="pupil"><circle cx="79" cy="86" r="6.5" fill="#1f1305"/><circle cx="81.5" cy="83" r="2.2" fill="#fff"/></g></g>
        <g class="eye"><ellipse class="ink" cx="121" cy="84" rx="11" ry="13" fill="#fff"/><g class="pupil"><circle cx="121" cy="86" r="6.5" fill="#1f1305"/><circle cx="123.500" cy="83" r="2.2" fill="#fff"/></g></g>
        <path id="brows" d="M64 64 L92 75 M136 64 L108 75" stroke="#3b1d0b" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="100" cy="103" rx="9.5" ry="6.500" fill="#1f1305"/>
        <path id="smile" class="ink" d="M85 113 q15 14 30 0" fill="none" stroke-width="3.500"/>
        <path id="tongue" class="ink" d="M93 119 q7 16 14 0 z" fill="#f87171" stroke-width="2.500"/>
        <g id="barkmouth"><path class="ink" d="M82 111 h36 q-4 26 -18 26 q-14 0 -18 -26 z" fill="#7f1d1d"/><path d="M88 112 l4 7 l4 -7 M104 112 l4 7 l4 -7" fill="#fff" stroke="#3b1d0b" stroke-width="1.500" stroke-linejoin="round"/></g>
      </g>
      <path d="M70 130 q30 18 60 0" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
      <path class="ink" d="M100 137 l9 4 v6 q0 7 -9 11 q-9 -4 -9 -11 v-6 z" fill="#99f6e4" stroke="#0f766e" stroke-width="2.500"/>
      <g id="angry">
        <path d="M152 24 q8 -2 8 -10 M166 28 q2 -8 10 -8 M170 42 q8 2 8 10 M156 38 q-2 8 -10 8" stroke="#dc2626" stroke-width="4.500" stroke-linecap="round" fill="none"/>
        <path d="M22 96 L6 88 M22 110 L4 112 M24 124 L8 134 M178 96 L194 88 M178 110 L196 112 M176 124 L192 134" stroke="#111" stroke-width="3.500" stroke-linecap="round" fill="none"/>
      </g>
    </svg>
  </div>
  <div id="dot" role="status">On guard</div>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const canvas = $('dog'), bubble = $('bubble'), info = $('info'), dot = $('dot');
  let hideTimer = null, infoTimer = null, state = null;

  // ---- speech bubbles ---------------------------------------------------------------------------------------
  let busyShown = false;
  // Bubbles carry one line only: the main message. The detail line is shown just for the sensor set-up steps.
  function say(title, text, tone, ms, withDetail) {
    if (info.classList.contains('show')) return;          // the status bubble is open
    busyShown = false;
    const extra = tone === true ? ' bad' : tone === 'good' ? ' good' : '';
    $('b-title').textContent = title;
    $('b-text').textContent = withDetail ? (text || '') : '';
    bubble.className = 'bubble show' + extra;
    clearTimeout(hideTimer);
    if (ms !== 0) hideTimer = setTimeout(() => { bubble.className = 'bubble' + extra; }, ms || 6000);
  }

  // ---- reactions --------------------------------------------------------------------------------------------
  const stage = $('stage');
  let reactTimer = null;

  // The bark is a real recording: desktop/assets/bark.mp3, bark.wav or bark.ogg.
  // Without a file the dog barks silently (the angry face, shake and speech bubble still show).
  let barkClip = null;
  (function findBarkClip(names) {
    if (!names.length) return;
    const clip = new Audio('assets/' + names[0]);
    clip.addEventListener('canplaythrough', () => { barkClip = clip; }, { once: true });
    clip.addEventListener('error', () => findBarkClip(names.slice(1)), { once: true });
    clip.load();
  })(['bark.mp3', 'bark.wav', 'bark.ogg']);

  function bark() {
    try {
      if (barkClip) {
        barkClip.currentTime = 0;
        barkClip.volume = 0.8;
        barkClip.play().catch(() => {});
        return;
      }
    } catch (_) { /* no sound device: the visual reaction still shows */ }
  }

  function react(kind) {
    clearTimeout(reactTimer);
    stage.classList.remove('angry', 'happy');
    void stage.offsetWidth;                                // restart the animation
    stage.classList.add(kind);
    if (kind === 'angry') bark();
    reactTimer = setTimeout(() => stage.classList.remove('angry', 'happy'), kind === 'angry' ? 3500 : 1200);
  }
  window.pgReact = react;

  function badge(el, text, tone) { el.textContent = text; el.className = 'badge ' + tone; el.title = text; }

  function renderInfo() {
    const s = state;
    if (!s) return;
    const ok = s.gateway && s.llm;
    $('i-title').textContent = ok ? "LonggaDog is on guard" : "LonggaDog can't check anything right now";
    $('i-sub').textContent = ok ? 'Only trusted work apps get the original. Everything else gets the safe copy.'
      : 'Until the local check is back, nothing can be pasted outside trusted apps.';
    info.classList.toggle('bad', !ok);
    badge($('i-gateway'), s.gateway ? 'Running' : 'Not running', s.gateway ? 'ok' : 'bad');
    badge($('i-llm'), s.llm ? s.model : (s.gateway ? 'Off' : 'Unknown'), s.llm ? 'ok' : 'bad');
    badge($('i-focus'), s.focus ? s.focus + (s.guarding ? ' (guarded)' : ' (trusted)') : 'None yet', s.focus ? (s.guarding ? 'tint' : 'ok') : '');
    // The sensor is the browser extension: with it, uploads and typed text in the browser are guarded too.
    const sensors = s.sensors || [];
    badge($('i-sensor-state'), sensors.length ? 'Connected: ' + sensors.join(', ') : 'Not connected', sensors.length ? 'ok' : 'bad');
    $('i-sensor-row').hidden = sensors.length > 0;
  }

  function showInfo(open) {
    clearTimeout(infoTimer);
    if (open) {
      bubble.className = 'bubble';
      renderInfo();
      info.classList.add('show');
      infoTimer = setTimeout(() => showInfo(false), 30000);
    } else {
      info.classList.remove('show');
    }
  }
  window.pgInfo = showInfo;
  $('i-close').addEventListener('click', () => showInfo(false));
  $('i-sensor').addEventListener('click', () => { showInfo(false); window.pg.setupSensor(); });
  $('i-dash').addEventListener('click', () => { window.pg.openDashboard(); showInfo(false); });

  // ---- follow the cursor across the whole desktop -----------------------------------------------------------
  // The main process reports where the cursor is on the screen, as -1..1 on each axis relative to the mascot.
  // The head leans and the pupils move that way.
  function point(fx, fy) {
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    // A cursor a quarter of the screen away already gets a full look, so nearby movement is clearly followed.
    canvas.style.setProperty('--px', clamp((fx - 0.5) * 8).toFixed(3));
    canvas.style.setProperty('--py', clamp((fy - 0.5) * 8).toFixed(3));
  }
  window.pgPoint = point;
  setTimeout(() => window.pg.mascotReady(), 50);
  let drag = null;
  window.pg.onCursor((p) => {
    if (!drag) point(0.5 + p.dx / 2, 0.5 + p.dy / 2);
    // The window is see-through and lets clicks pass to the apps underneath, except over the dog and an open bubble.
    const el = document.elementFromPoint(p.x, p.y);
    const hit = !!drag || (!!el && (canvas.contains(el) || (info.classList.contains('show') && info.contains(el))));
    if (hit !== lastHit) { lastHit = hit; window.pg.setMascotHit(hit); }
  });
  let lastHit = false;

  // Drag to move the window; right-click opens the status bubble.
  canvas.addEventListener('pointerdown', (e) => { if (e.button !== 0) return; drag = { x: e.screenX, y: e.screenY, moved: false }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    canvas.classList.add('dragging');
    window.pg.moveMascot(dx, dy);
    drag.x = e.screenX; drag.y = e.screenY;
  });
  const endDrag = () => { drag = null; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); showInfo(!info.classList.contains('show')); });
  let wasOk = null;
  window.pg.onState((s) => {
    state = s;
    const ok = s.gateway && s.llm;
    dot.className = ok ? '' : 'bad';
    dot.textContent = 'LonggaDog · ' + (ok ? (s.guarding ? 'guarding' : 'on guard') : 'off');
    if (info.classList.contains('show')) renderInfo();
    if (!ok && wasOk !== false) say('Local check is off', 'Pasting outside trusted apps is blocked.', true, 0);
    if (ok && wasOk === false) say('Back on guard', 'The local check is running again.', false);
    wasOk = ok;
  });
  window.pg.onGuardEvent((e) => {
    const where = e.app ? ` in ${e.app}` : '';
    if (e.kind === 'sanitized') { react('angry'); say('WOOF! WOOF! Sensitive info stopped', (e.tally || 'It was replaced with a safe copy') + where + '.', true, 8000); }
    else if (e.kind === 'blocked') { react('angry'); say('GRRR! WOOF! Blocked', e.reason || 'That could not be sent' + where + '.', true, 9000); }
    else if (e.kind === 'clean') react('happy');           // a quiet hop and tail wag: no bubble, no sound
    else if (e.kind === 'reminder') say(e.title, e.reason, false, 7000);
    else if (e.kind === 'steps') say(e.title, e.reason, false, 45000, true);
    else if (e.kind === 'notice') {
      // Something the browser extension wants the user to know, word for word.
      const site = e.app && e.app !== 'web' ? ` (${e.app})` : '';
      if (e.mood === 'done') { if (busyShown) { busyShown = false; clearTimeout(hideTimer); bubble.className = 'bubble'; } }
      else if (e.mood === 'busy') { say(e.title, e.reason, false, 0); busyShown = true; hideTimer = setTimeout(() => { bubble.className = 'bubble'; }, 120000); }
      else if (e.mood === 'angry') { react('angry'); say('WOOF! ' + e.title + site, e.reason, true, 10000); }
      else if (e.mood === 'happy') { react('happy'); say(e.title + site, e.reason, 'good', 5000); }
      else say(e.title + site, e.reason, false, 7000);
    }
  });
})();
</script>
</body>
</html>
